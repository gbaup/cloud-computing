<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cuaderno · Asistente de documentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #1d1b18;
      --muted: #6f6a61;
      --line: #e6e1d6;
      --accent: #3d4fd6;
      --accent-soft: #e9ebfb;
      --ok: #1f8a4c;
      --warn: #b7791f;
      --err: #c0392b;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(29, 27, 24, .04), 0 8px 24px rgba(29, 27, 24, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --panel: #1e1c19;
        --ink: #eeeae2;
        --muted: #a29c90;
        --line: #2f2c27;
        --accent: #8d9bff;
        --accent-soft: #262a48;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 Inter, system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    button { font: inherit; cursor: pointer; }

    header {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 24px; border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 { font: 600 22px/1 Fraunces, serif; margin: 0; letter-spacing: -.01em; }
    .brand span { color: var(--muted); font-size: 13px; }
    .spacer { flex: 1; }
    .ghost {
      background: transparent; border: 1px solid var(--line); color: var(--ink);
      padding: 7px 14px; border-radius: 999px; font-size: 13px;
    }
    .ghost:hover { border-color: var(--accent); color: var(--accent); }

    .layout {
      display: grid; grid-template-columns: 320px 1fr; gap: 20px;
      padding: 20px 24px; min-height: 0;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
      display: flex; flex-direction: column; min-height: 0;
    }

    /* ---------- Fuentes ---------- */
    .sources-head { padding: 18px 18px 10px; display: flex; align-items: center; gap: 8px; }
    .sources-head h2 { font: 600 16px Fraunces, serif; margin: 0; }
    .count { color: var(--muted); font-size: 13px; }
    .drop {
      margin: 0 18px 12px; padding: 18px; text-align: center;
      border: 1.5px dashed var(--line); border-radius: 12px; color: var(--muted);
      font-size: 13px; transition: .15s;
    }
    .drop strong { color: var(--accent); }
    .drop.over, .drop:hover { border-color: var(--accent); background: var(--accent-soft); cursor: pointer; }
    .doc-list { list-style: none; margin: 0; padding: 0 10px; overflow: auto; flex: 1; }
    .doc-list li {
      display: flex; gap: 10px; align-items: center;
      padding: 9px 8px; border-radius: 10px;
    }
    .doc-list li:hover { background: var(--bg); }
    .doc-icon {
      flex: none; width: 30px; height: 30px; border-radius: 8px;
      display: grid; place-items: center; font-size: 10px; font-weight: 600;
      background: var(--accent-soft); color: var(--accent); text-transform: uppercase;
    }
    .doc-name { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-meta { font-size: 12px; color: var(--muted); }
    .empty-docs { color: var(--muted); font-size: 13px; padding: 8px 10px; }
    .sources-foot {
      border-top: 1px solid var(--line); padding: 12px 18px;
      display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.ok { background: var(--ok); }
    .dot.busy { background: var(--warn); animation: pulse 1.2s infinite; }
    .dot.err { background: var(--err); }
    @keyframes pulse { 50% { opacity: .3; } }

    /* ---------- Chat ---------- */
    .chat { overflow: hidden; }
    .messages { flex: 1; overflow: auto; padding: 28px 8%; }
    .welcome { max-width: 560px; margin: 8vh auto 0; text-align: center; }
    .welcome h2 { font: 500 32px/1.15 Fraunces, serif; margin: 0 0 10px; letter-spacing: -.02em; }
    .welcome p { color: var(--muted); margin: 0 0 24px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .suggestion {
      background: var(--bg); border: 1px solid var(--line); color: var(--ink);
      padding: 8px 14px; border-radius: 999px; font-size: 13.5px;
    }
    .suggestion:hover { border-color: var(--accent); color: var(--accent); }

    .msg { max-width: 760px; margin: 0 auto 22px; }
    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .bubble {
      background: var(--accent); color: #fff; padding: 10px 16px;
      border-radius: 18px 18px 4px 18px; max-width: 80%;
    }
    .msg.bot .answer > :first-child { margin-top: 0; }
    .msg.bot .answer > :last-child { margin-bottom: 0; }
    .msg.bot .answer p { margin: 0 0 10px; }
    .cite {
      display: inline-grid; place-items: center; min-width: 19px; height: 19px;
      padding: 0 5px; margin: 0 1px; border-radius: 6px; border: 0;
      background: var(--accent-soft); color: var(--accent);
      font-size: 11px; font-weight: 600; vertical-align: 2px;
    }
    .cite:hover, .cite.active { background: var(--accent); color: #fff; }
    .cited { margin-top: 14px; display: grid; gap: 8px; }
    .cited-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .source-card {
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      font-size: 13px; transition: .15s;
    }
    .source-card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .source-card header { all: unset; display: flex; gap: 8px; align-items: center; font-weight: 500; }
    .source-card .snippet {
      color: var(--muted); margin-top: 6px; white-space: pre-wrap;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .source-card.active .snippet { -webkit-line-clamp: unset; }
    .thinking { color: var(--muted); display: flex; gap: 10px; align-items: center; }
    .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1s infinite; }
    .thinking i:nth-child(2) { animation-delay: .2s; }
    .thinking i:nth-child(3) { animation-delay: .4s; }
    .error { color: var(--err); }

    .composer { padding: 14px 8% 20px; }
    .composer form {
      max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
      background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 8px 16px;
    }
    .composer form:focus-within { border-color: var(--accent); }
    textarea {
      flex: 1; border: 0; background: transparent; color: var(--ink); resize: none;
      font: inherit; padding: 8px 0; max-height: 160px; outline: none;
    }
    .send {
      border: 0; background: var(--accent); color: #fff; width: 40px; height: 40px;
      border-radius: 12px; font-size: 18px;
    }
    .send:disabled { opacity: .4; cursor: default; }
    .hint { max-width: 760px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--muted); }

    @media (max-width: 820px) {
      body { height: auto; }
      .layout { grid-template-columns: 1fr; padding: 12px 16px; }
      .panel.sources { max-height: 320px; }
      .chat { min-height: 70vh; }
      .messages, .composer { padding-left: 16px; padding-right: 16px; }
      .brand span { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Cuaderno</h1>
      <span>Preguntale a tus documentos · RAG sobre AWS</span>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="new-chat">Nueva conversación</button>
  </header>

  <div class="layout">
    <aside class="panel sources">
      <div class="sources-head">
        <h2>Fuentes</h2><span class="count" id="doc-count"></span>
      </div>
      <label class="drop" id="drop">
        <input type="file" id="file-input" multiple hidden
               accept=".pdf,.txt,.md,.html,.csv,.doc,.docx,.xls,.xlsx" />
        <strong>Subí documentos</strong> o arrastralos acá<br />PDF, Word, Markdown, TXT, CSV
      </label>
      <ul class="doc-list" id="doc-list"></ul>
      <div class="sources-foot">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Cargando…</span>
        <div class="spacer"></div>
        <button class="ghost" id="sync">Reindexar</button>
      </div>
    </aside>

    <main class="panel chat">
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <h2>¿Qué querés saber de tus documentos?</h2>
          <p>Las respuestas salen solo de las fuentes cargadas, con citas a cada fragmento usado.</p>
          <div class="suggestions">
            <button class="suggestion">¿Cuántos días de vacaciones me corresponden?</button>
            <button class="suggestion">¿Cómo es el proceso para pasar un cambio a producción?</button>
            <button class="suggestion">¿Qué diferencia hay entre IaaS, PaaS y SaaS?</button>
            <button class="suggestion">Resumí la política de trabajo remoto</button>
          </div>
        </div>
      </div>
      <div class="composer">
        <form id="ask-form">
          <textarea id="question" rows="1" placeholder="Escribí tu pregunta…"></textarea>
          <button class="send" id="send" type="submit" aria-label="Enviar">↑</button>
        </form>
        <div class="hint">Generado con Amazon Bedrock · puede equivocarse, revisá las fuentes</div>
      </div>
    </main>
  </div>

  <script>
    const API = window.API_URL;
    const $ = (id) => document.getElementById(id);
    let sessionId = null;
    let pollTimer = null;

    async function api(path, options = {}) {
      const res = await fetch(API + path, {
        ...options,
        headers: { "content-type": "application/json" },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
      return data;
    }

    // ---------- Fuentes ----------
    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    async function loadDocuments() {
      const { documents } = await api("/documents");
      $("doc-count").textContent = documents.length ? `${documents.length}` : "";
      const list = $("doc-list");
      list.innerHTML = "";
      if (!documents.length) {
        list.innerHTML = `<li class="empty-docs">Todavía no hay documentos.</li>`;
        return;
      }
      for (const doc of documents) {
        const ext = doc.name.split(".").pop().slice(0, 4);
        const li = document.createElement("li");
        li.innerHTML = `<div class="doc-icon"></div><div style="min-width:0"><div class="doc-name"></div><div class="doc-meta"></div></div>`;
        li.querySelector(".doc-icon").textContent = ext;
        li.querySelector(".doc-name").textContent = doc.name;
        li.querySelector(".doc-name").title = doc.name;
        li.querySelector(".doc-meta").textContent =
          `${formatSize(doc.size)} · ${new Date(doc.lastModified).toLocaleDateString("es")}`;
        list.appendChild(li);
      }
    }

    function setStatus(kind, text) {
      $("status-dot").className = `dot ${kind}`;
      $("status-text").textContent = text;
    }

    // Consulta el estado de la ingesta. `since` permite esperar a que arranque un job nuevo.
    async function refreshStatus(since = 0) {
      clearTimeout(pollTimer);
      try {
        const s = await api("/status");
        const started = s.startedAt ? Date.parse(s.startedAt) : 0;
        const waitingNewJob = since && started < since;
        if (waitingNewJob || ["STARTING", "IN_PROGRESS", "STOPPING"].includes(s.status)) {
          setStatus("busy", "Indexando documentos…");
          pollTimer = setTimeout(() => refreshStatus(since), 3000);
        } else if (s.status === "COMPLETE") {
          const n = s.statistics?.numberOfDocumentsScanned;
          setStatus("ok", n != null ? `Índice al día · ${n} documentos` : "Índice al día");
        } else if (s.status === "NEVER_RUN") {
          setStatus("", "Sin indexar todavía");
        } else {
          setStatus("err", `Ingesta: ${s.status}`);
        }
      } catch (e) {
        setStatus("err", "No se pudo consultar el estado");
      }
    }

    async function uploadFiles(files) {
      const since = Date.now() - 5000;
      setStatus("busy", `Subiendo ${files.length} archivo(s)…`);
      try {
        for (const file of files) {
          const contentType = file.type || "application/octet-stream";
          const { url } = await api("/upload-url", {
            method: "POST",
            body: JSON.stringify({ filename: file.name, contentType }),
          });
          const res = await fetch(url, { method: "PUT", body: file, headers: { "content-type": contentType } });
          if (!res.ok) throw new Error(`No se pudo subir ${file.name}`);
        }
        await loadDocuments();
        refreshStatus(since);
      } catch (e) {
        setStatus("err", e.message);
      }
    }

    const drop = $("drop");
    $("file-input").addEventListener("change", (e) => {
      if (e.target.files.length) uploadFiles([...e.target.files]);
      e.target.value = "";
    });
    ["dragenter", "dragover"].forEach((ev) =>
      drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((ev) =>
      drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => {
      if (e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files]);
    });

    $("sync").addEventListener("click", async () => {
      const since = Date.now() - 5000;
      await api("/sync", { method: "POST" }).catch(() => {});
      refreshStatus(since);
    });

    // ---------- Chat ----------
    function addMessage(role, html) {
      $("welcome")?.remove();
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.innerHTML = html;
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      const d = document.createElement("div");
      d.textContent = text;
      return d.innerHTML;
    }

    function renderAnswer(container, { answer, sources }) {
      const html = DOMPurify.sanitize(marked.parse(answer))
        .replace(/⟦(\d+)⟧/g, (_, n) => `<button class="cite" data-n="${n}">${n}</button>`);
      container.innerHTML = `<div class="answer">${html}</div>`;
      if (!sources.length) return;

      const cited = document.createElement("div");
      cited.className = "cited";
      cited.innerHTML = `<div class="cited-title">Fuentes citadas</div>`;
      for (const s of sources) {
        const card = document.createElement("div");
        card.className = "source-card";
        card.dataset.n = s.n;
        card.innerHTML = `<header><span class="cite">${s.n}</span><span></span></header><div class="snippet"></div>`;
        card.querySelector("header span:last-child").textContent = s.file;
        card.querySelector(".snippet").textContent = s.snippet;
        card.addEventListener("click", () => card.classList.toggle("active"));
        cited.appendChild(card);
      }
      container.appendChild(cited);

      container.querySelectorAll(".answer .cite").forEach((btn) =>
        btn.addEventListener("click", () => {
          container.querySelectorAll(".active").forEach((el) => el.classList.remove("active"));
          const card = cited.querySelector(`.source-card[data-n="${btn.dataset.n}"]`);
          card.classList.add("active");
          btn.classList.add("active");
          card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }));
    }

    async function ask(question) {
      addMessage("user", `<div class="bubble">${escapeHtml(question)}</div>`);
      const bot = addMessage("bot", `<div class="thinking"><i></i><i></i><i></i> Buscando en tus documentos…</div>`);
      $("send").disabled = true;
      try {
        const data = await api("/ask", {
          method: "POST",
          body: JSON.stringify({ question, sessionId }),
        });
        sessionId = data.sessionId;
        renderAnswer(bot, data);
      } catch (e) {
        bot.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      } finally {
        $("send").disabled = false;
        $("messages").scrollTop = $("messages").scrollHeight;
      }
    }

    const textarea = $("question");
    textarea.addEventListener("input", () => {
      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
    });
    textarea.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask-form").requestSubmit(); }
    });
    $("ask-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = textarea.value.trim();
      if (!q || $("send").disabled) return;
      textarea.value = "";
      textarea.style.height = "auto";
      ask(q);
    });
    document.querySelectorAll(".suggestion").forEach((b) =>
      b.addEventListener("click", () => ask(b.textContent)));

    $("new-chat").addEventListener("click", () => location.reload());

    loadDocuments().catch((e) => setStatus("err", e.message));
    refreshStatus();
  </script>
</body>
</html>
